<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GenAI Multi-Modal Assistant</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

<h2>🤖 GenAI Multi-Modal Assistant</h2>

<!-- ================= TEXT INPUT ================= -->
<form method="POST" action="/ask" class="card">

    <label for="text-input">Ask your question</label>

    <textarea
        id="text-input"
        name="text"
        placeholder="Type your question here..."
        rows="4"
        required></textarea>

    <div class="center">
        <button type="submit">Ask AI</button>
    </div>
</form>

<!-- ================= VOICE INPUT (SPEAK FEATURE) ================= -->
<div class="card center">
    <button id="voice-btn" type="button">🎤 Speak</button>
</div>

<!-- ================= IMAGE INPUT ================= -->
<form method="POST" action="/image" enctype="multipart/form-data" class="card">

    <label for="image-upload">Upload an image</label>

    <input
        type="file"
        id="image-upload"
        name="image"
        accept="image/*"
        required>

    <div class="center">
        <button type="submit">Upload Image</button>
    </div>
</form>

<!-- ================= SPEAKER CONTROLS ================= -->
<div class="card center">
    <h3>🔊 Speaker Controls</h3>

    <div class="btn-group">
        <button id="play-speech">▶ Play</button>
        <button id="stop-speech">⏹ Stop</button>
        <button id="speaker-toggle">🔈 Speaker ON</button>
    </div>
</div>

<!-- ================= RESPONSE ================= -->
{% if reply %}
<div class="response card">
    <h3>AI Response</h3>

    <pre id="ai-text">{{ reply }}</pre>

    {% if emotion %}
    <p class="emotion">
        Detected emotion: <b>{{ emotion }}</b>
    </p>
    {% endif %}
</div>
{% endif %}

</div>

<!-- ================= JS ================= -->
<script>
/* ---------- READ URL PARAMS ---------- */
const urlParams = new URLSearchParams(window.location.search);
const autoSpeak = urlParams.get("speak") === "1";

/* ---------- VOICE INPUT (MIC) ---------- */
document.getElementById("voice-btn").addEventListener("click", () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
        alert("Please use Google Chrome for voice input.");
        return;
    }

    const recognition = new SR();
    recognition.lang = "en-IN";
    recognition.start();

    recognition.onresult = (event) => {
        const spokenText = event.results[0][0].transcript;
        window.location.href =
            `/voice?text=${encodeURIComponent(spokenText)}&speak=1`;
    };
});

/* ---------- SPEAKER (TEXT TO SPEECH) ---------- */
let speakerOn = true;
let lastText = "";
let lastEmotion = "{{ emotion }}";

function speak(text) {
    if (!speechSynthesis || !speakerOn || !text) return;

    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-IN";

    if (lastEmotion === "confused") {
        u.rate = 0.85;
        u.pitch = 1.0;
    } else {
        u.rate = 1.0;
        u.pitch = 1.0;
    }

    speechSynthesis.speak(u);
}

/* ---------- AUTO SPEAK ON PAGE LOAD (ONLY FOR MIC) ---------- */
window.onload = () => {
    const el = document.getElementById("ai-text");
    if (!el) return;

    lastText = el.innerText.trim();

    // 🔥 THIS WAS MISSING
    if (autoSpeak) {
        speak(lastText);
    }
};

/* ---------- CONTROLS ---------- */
document.getElementById("play-speech").addEventListener("click", () => {
    speak(lastText);
});

document.getElementById("stop-speech").addEventListener("click", () => {
    speechSynthesis.cancel();
});

document.getElementById("speaker-toggle").addEventListener("click", () => {
    speakerOn = !speakerOn;
    const btn = document.getElementById("speaker-toggle");

    if (!speakerOn) {
        speechSynthesis.cancel();
        btn.innerText = "🔇 Speaker OFF";
    } else {
        btn.innerText = "🔈 Speaker ON";
    }
});
</script>

</body>
</html>
